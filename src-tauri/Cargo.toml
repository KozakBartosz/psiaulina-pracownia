[package]
name = "psiaulina"
version = "0.1.1"
edition = "2021"

[lib]
name = "psiaulina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
trash = "5"
